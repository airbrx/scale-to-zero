  <h2>How We Make These</h2>
  <p>A short film about how the Report's films are made, made the same way and in the same material. Every film is a place folded out of paper: here one page becomes a street at night in fog, a mill on someone else's river and a whole city, then folds back to the page. Then the storytelling moves, shown rather than told: the receipt, one thing we follow, the receipts and the phone at the edges, the turn, telling it twice, the honest caveat, and an emptier last frame. The method is written up in <code>stories/STYLE.md</code>; the worked examples are <em>Probe All You Want</em> and <em>GitHub Didn't Break Today</em>.</p>
  <p>The ten rules in the cold open are the manifesto's own, word for word (The Flat Stack, "The Southern Cross"). The application they rebuild, and the phone's feed, are illustrative.</p>
