  <h2>The Film Is the Code</h2>
  <p>Rewritten as a film from the Report's article "The film is the code". The film sizes (540 MB at the kit's 9 Mbps export, about 85 KB of drawing code, 3 to 4 MB of voice, about 4 MB in all) were measured from our own story kit and the <em>every-scanner</em> film on 4 October 2026; the 150 MB web version assumes 2.5 Mbps. The delivery costs use CloudFront's North American list price. The street, the depot, the lorries, the towers and the couriers are a picture of how the bytes travel, not a diagram of any network; how many lorries go to which house is illustrative. The scorecard findings are from running the film's player against the Report's own flat-stack scorecard.</p>
