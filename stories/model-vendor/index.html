  <p>Rewritten as a film from the Report's article of the same name. The 174 minutes, the 50 incidents in seven weeks and the 12 that cite an upstream model provider are from GitHub's public status feed; the 177 minutes are from Anthropic's status page. On the seven-week line, nine of the twelve upstream incidents sit on their dates; the other three, and the other 38 incidents, are placed for illustration. The machine is a picture of the architecture, not a diagram of GitHub's: its own services are stations on its own conveyor, and each model in Copilot is a belt driven through a shaft by its provider's engine outside the wall. When the three engines stop in the wide shot is illustrative. The airbrx gateway is the author's own.</p>
